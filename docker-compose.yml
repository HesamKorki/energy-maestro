version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: energy_maestro_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-energy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-energy123}
      POSTGRES_DB: ${POSTGRES_DB:-energy_maestro}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-energy} -d ${POSTGRES_DB:-energy_maestro}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:

